<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontem — Strategic Supply Chain Audit</title>

  <meta property="og:title" content="Frontem — Strategic Supply Chain Audit">
  <meta property="og:description" content="Potenziale zur Steigerung des Unternehmenserfolgs">
  <meta property="og:image" content="https://www.frontemproject.com/operational-excellence/og-image.jpg">
  <meta property="og:url" content="https://www.frontemproject.com/operational-excellence">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Frontem — Strategic Supply Chain Audit">
  <meta name="twitter:description" content="Potenziale zur Steigerung des Unternehmenserfolgs">
  <meta name="twitter:image" content="https://www.frontemproject.com/operational-excellence/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>

    /* ═══════════════════════════════════════════════════════════
       FRONTEM PRESENTATION ENGINE v3
       ═══════════════════════════════════════════════════════════ */

    :root {
      --c-dark:        #080C16;
      --c-dark-2:      #0E1420;
      --c-dark-3:      #141C2E;
      --c-navy:        #1A3564;
      --c-blue:        #2F5FAD;
      --c-blue-mid:    #4478C8;
      --c-blue-light:  #6B9DE8;
      --c-white:       #FFFFFF;
      --c-off-white:   #F4F6FA;
      --c-border:      #DDE2EC;
      --c-border-dark: rgba(255,255,255,0.07);
      --c-text-dim:    #5A6478;

      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --font-serif: 'Pinyon Script', 'Playfair Display', Georgia, 'Times New Roman', serif;
      --nav-h: 64px;
      --pad-x: 72px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --t-chapter: 0.75s;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--font); background: var(--c-dark); color: var(--c-white); -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: none; cursor: pointer; font: inherit; }
    ul { list-style: none; }

    /* ═══════════════════════════════════════════════════════════
       NAVIGATION
       ═══════════════════════════════════════════════════════════ */

    #nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h); z-index: 500;
      display: flex; align-items: center;
      padding: 0 var(--pad-x);
      transition: background 0.5s, border-color 0.5s;
    }
    #nav.on-dark { background: rgba(8,12,22,0.78); backdrop-filter: blur(28px) saturate(180%); border-bottom: 1px solid var(--c-border-dark); }
    #nav.on-light { background: rgba(244,246,250,0.88); backdrop-filter: blur(28px) saturate(180%); border-bottom: 1px solid rgba(0,0,0,0.07); }

    /* ── FRONTEM LOGO (cursive F + wordmark) ── */
    .nav-logo { display: flex; align-items: center; gap: 11px; cursor: pointer; flex-shrink: 0; }

    .nav-logo-f {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.4s, box-shadow 0.4s;
      font-family: 'Pinyon Script', serif; font-style: normal;
      font-size: 23px; font-weight: 400; line-height: 1;
      position: relative;
    }
    .nav-logo-f span {
      display: block;
      transform: translate(-5px, 1px);
    }
    #nav.on-dark  .nav-logo-f { background: rgba(255,255,255,0.96); color: var(--c-navy); box-shadow: 0 2px 12px rgba(0,0,0,0.35); }
    #nav.on-light .nav-logo-f { background: var(--c-navy); color: #fff; box-shadow: 0 2px 12px rgba(26,53,100,0.35); }

    .nav-logo-text { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; transition: color 0.4s; }
    #nav.on-dark  .nav-logo-text { color: #fff; }
    #nav.on-light .nav-logo-text { color: var(--c-dark); }

    .nav-menu { display: flex; gap: 26px; margin-left: 44px; }
    .nav-menu li a { font-size: 13.8px; font-weight: 500; letter-spacing: 0.03em; cursor: pointer; opacity: 0.36; transition: opacity 0.25s, color 0.4s; white-space: nowrap; }
    /* This deck has 11 chapters (vs. the template default of 8) — the nav needs a
       higher-density variant so all items stay legible and don't collide with the
       chapter counter. Scoped to decks with many chapters via body[data-dense-nav]. */
    body[data-dense-nav] .nav-menu { gap: 15px; margin-left: 28px; margin-right: 24px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent 100%); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent 100%); }
    body[data-dense-nav] .nav-menu::-webkit-scrollbar { display: none; }
    body[data-dense-nav] .nav-menu li { flex-shrink: 0; }
    body[data-dense-nav] .nav-menu li a { font-size: 12px; letter-spacing: 0.01em; }
    body[data-dense-nav] .nav-right { gap: 12px; flex-shrink: 0; }
    body[data-dense-nav] .nav-progress-track { width: 40px; }
    .nav-menu li a.active { opacity: 1; }
    .nav-menu li a:hover  { opacity: 0.72; }
    #nav.on-dark  .nav-menu li a { color: #fff; }
    #nav.on-light .nav-menu li a { color: var(--c-dark); }

    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
    .lang-toggle { display: flex; align-items: center; gap: 7px; }
    .lang-btn { background: none; border: none; padding: 3px 2px; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; opacity: 0.38; transition: opacity 0.25s, color 0.4s; }
    .lang-btn.active { opacity: 1; }
    .lang-btn:hover { opacity: 0.75; }
    .lang-sep { font-size: 11px; opacity: 0.25; }
    .mob-lang-toggle .lang-btn { opacity: 0.5; }
    .mob-lang-toggle .lang-btn.active { opacity: 1; border-color: rgba(255,255,255,0.6) !important; }
    #nav.on-dark  .lang-btn, #nav.on-dark  .lang-sep { color: #fff; }
    #nav.on-light .lang-btn, #nav.on-light .lang-sep { color: var(--c-dark); }
    body[data-dense-nav] .lang-toggle { padding-right: 2px; border-right: 1px solid; }
    body[data-dense-nav] #nav.on-dark  .lang-toggle { border-color: rgba(255,255,255,0.14); }
    body[data-dense-nav] #nav.on-light .lang-toggle { border-color: rgba(0,0,0,0.12); }
    .chapter-counter { font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; transition: color 0.4s; }
    #nav.on-dark  .chapter-counter { color: rgba(255,255,255,0.28); }
    #nav.on-light .chapter-counter { color: rgba(0,0,0,0.28); }

    .nav-progress-track { width: 60px; height: 1px; position: relative; transition: background 0.4s; }
    #nav.on-dark  .nav-progress-track { background: rgba(255,255,255,0.1); }
    #nav.on-light .nav-progress-track { background: rgba(0,0,0,0.1); }
    .nav-progress-fill { position: absolute; top: 0; left: 0; bottom: 0; background: var(--c-blue-mid); transition: width 0.65s var(--ease-out); }

    .nav-hamburger { display: none; flex-direction: column; gap: 5px; padding: 6px; margin-left: auto; }
    .nav-hamburger span { display: block; width: 22px; height: 1px; transition: background 0.4s; }
    #nav.on-dark  .nav-hamburger span { background: rgba(255,255,255,0.7); }
    #nav.on-light .nav-hamburger span { background: rgba(0,0,0,0.7); }

    /* ═══════════════════════════════════════════════════════════
       CHAPTER SYSTEM
       ═══════════════════════════════════════════════════════════ */

    #presentation { position: relative; width: 100%; height: 100vh; overflow: hidden; }

    .chapter {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; overflow: hidden;
      opacity: 0; transform: translateY(2.8%); pointer-events: none;
      transition: opacity var(--t-chapter) var(--ease-out), transform var(--t-chapter) var(--ease-out);
    }
    .chapter.is-above  { transform: translateY(-2.8%); opacity: 0; pointer-events: none; }
    .chapter.is-active { transform: translateY(0); opacity: 1; pointer-events: all; }
    .chapter.is-below  { transform: translateY(2.8%); opacity: 0; pointer-events: none; }

    .ch-dark      { background: var(--c-dark);    color: #fff; }
    .ch-dark-navy { background: var(--c-dark-2);  color: #fff; }
    .ch-light     { background: var(--c-off-white); color: var(--c-dark); }
    .ch-white     { background: #fff; color: var(--c-dark); }

    .ch-inner {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; justify-content: center;
      flex: 1; padding: calc(var(--nav-h) + 52px) var(--pad-x) 52px;
      max-width: 1440px; margin: 0 auto; width: 100%;
    }

    /* entrance animations — keyframe-based so they fire on initial page load too */
    @keyframes animIn {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim { opacity: 0; }
    .chapter.is-active .anim    { animation: animIn 0.75s var(--ease-out) both; }
    .chapter.is-active .anim.d1 { animation-delay: 0.08s; }
    .chapter.is-active .anim.d2 { animation-delay: 0.20s; }
    .chapter.is-active .anim.d3 { animation-delay: 0.32s; }
    .chapter.is-active .anim.d4 { animation-delay: 0.44s; }
    .chapter.is-active .anim.d5 { animation-delay: 0.56s; }
    .chapter.is-active .anim.d6 { animation-delay: 0.68s; }

    .label { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 22px; }
    .label::before { content: ''; display: block; width: 20px; height: 1px; background: currentColor; opacity: 0.3; }

    /* ═══════════════════════════════════════════════════════════
       CHAPTER 1 — HERO  (mountain SVG background + particles)
       ═══════════════════════════════════════════════════════════ */

    .hero-bg { position: absolute; inset: 0; z-index: 1; overflow: hidden; }

    /* ── SVG Mountain Landscape ── */
    .hero-mountain-svg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
    }

    .hero-bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(8,12,22,0.55) 0%,
        rgba(8,12,22,0.3)  35%,
        rgba(8,12,22,0.45) 65%,
        rgba(8,12,22,0.9)  100%
      );
    }

    .hero-bg-gradient-accent {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 70% at 80% 35%, rgba(47,95,173,0.30) 0%, transparent 60%);
      animation: gradientPulse 8s ease-in-out infinite alternate;
    }
    @keyframes gradientPulse { from { opacity: 0.8; } to { opacity: 1; transform: scale(1.05); } }

    #hero-canvas { position: absolute; inset: 0; opacity: 0.28; }

    .hero-inner { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding-bottom: 20px; }

    .hero-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--c-blue-light); margin-bottom: 28px; }
    .hero-title {
      font-size: clamp(42px, 5.5vw, 88px); font-weight: 300;
      line-height: 1.06; letter-spacing: -0.025em; max-width: 920px; margin-bottom: 26px;
    }
    .hero-title em { font-style: normal; font-weight: 500; }
    .hero-brand {
      font-weight: 300;
    }
    .hero-subtitle { font-size: clamp(15px, 1.5vw, 19px); font-weight: 400; line-height: 1.65; max-width: 540px; color: rgba(255,255,255,0.52); margin-bottom: 48px; }
    .hero-divider { width: 1px; height: 44px; background: linear-gradient(to bottom, rgba(255,255,255,0.28), transparent); margin-bottom: 32px; }
    .hero-stats { display: flex; gap: 52px; margin-bottom: 28px; }
    .hero-stat-value {
      font-size: 38px; font-weight: 300; letter-spacing: -0.025em; margin-bottom: 5px;
      background: linear-gradient(135deg, #fff 0%, rgba(107,157,232,0.9) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-stat-label { font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.32); }
    .hero-confidential { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.18); }

    /* ═══════════════════════════════════════════════════════════
       CHAPTER 2 — FOCUS AREAS
       ═══════════════════════════════════════════════════════════ */

    .focus-lead { max-width: 640px; margin-bottom: 26px; }
    .focus-lead .display-title { font-size: clamp(28px, 3.2vw, 50px); font-weight: 300; line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 14px; color: var(--c-dark); }
    .focus-lead .display-title em { font-style: normal; font-weight: 500; }
    .focus-lead p { font-size: 15px; line-height: 1.7; color: var(--c-text-dim); }
    .focus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--c-border); }
    .focus-item { background: var(--c-white); padding: 22px 26px 26px; transition: transform 0.35s var(--ease-out), box-shadow 0.35s, background 0.2s; }
    .focus-item:hover { background: var(--c-off-white); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); z-index: 2; }
    .focus-num { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--c-blue); margin-bottom: 12px; }
    .focus-text { font-size: 15px; line-height: 1.68; color: #3A4558; }
    .focus-item-filler { background: var(--c-white); }

    /* ═══════════════════════════════════════════════════════════
       CHAPTER 3 — EXPERTISE  (Munich geometric diamond bg)
       ═══════════════════════════════════════════════════════════ */

    /* Geometric diamond overlay — recreates the Munich brand pattern */
    .expertise-bg {
      position: absolute; inset: 0; z-index: 1; overflow: hidden;
      pointer-events: none;
    }
    .diamond {
      position: absolute;
      transform: rotate(45deg);
      border: 1px solid rgba(68,120,200,0.12);
    }
    .diamond-1 { width: 560px; height: 560px; top: -120px; right: -80px; background: rgba(47,95,173,0.06); }
    .diamond-2 { width: 380px; height: 380px; top: 60px;  right: 180px; background: rgba(27,61,114,0.08); }
    .diamond-3 { width: 280px; height: 280px; top: 200px; right: 320px; background: rgba(68,120,200,0.05); }
    .diamond-4 { width: 200px; height: 200px; bottom: 60px; left: 60%;  background: rgba(47,95,173,0.04); }

    .expertise-header { margin-bottom: 48px; }
    .expertise-title { font-size: clamp(32px, 4vw, 64px); font-weight: 300; line-height: 1.1; letter-spacing: -0.025em; }
    .expertise-title em { font-style: normal; font-weight: 500; }
    .expertise-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(255,255,255,0.06); }
    .expertise-col { padding: 38px 34px 44px; background: rgba(14,20,32,0.85); transition: background 0.3s, transform 0.35s var(--ease-out), box-shadow 0.35s; }
    .expertise-col:hover { background: rgba(47,95,173,0.18); transform: translateY(-4px); box-shadow: 0 20px 50px rgba(0,0,0,0.35); z-index: 2; }
    .exp-num { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: var(--c-blue-light); margin-bottom: 22px; }
    .exp-rule { width: 28px; height: 1px; background: rgba(255,255,255,0.1); margin-bottom: 22px; }
    .exp-title { font-size: 19px; font-weight: 400; line-height: 1.3; margin-bottom: 14px; color: #fff; }
    .exp-text { font-size: 15px; line-height: 1.72; color: rgba(255,255,255,0.44); }

    /* ═══════════════════════════════════════════════════════════
       NARRATIVE + COMPANY  (new content-driven chapter types,
       built exclusively from existing design tokens)
       ═══════════════════════════════════════════════════════════ */

    .narrative-header { margin-bottom: 28px; max-width: 760px; }
    .narrative-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
    .narrative-col { display: flex; flex-direction: column; }
    .narrative-p { font-size: 14.5px; line-height: 1.62; color: rgba(255,255,255,0.62); margin-bottom: 12px; }
    .narrative-p:last-child { margin-bottom: 0; }
    .narrative-quote { margin-top: 16px; padding: 16px 22px; border-left: 2px solid var(--c-blue-light); background: rgba(255,255,255,0.03); }
    .narrative-quote p { font-size: 15px; font-style: italic; font-weight: 500; line-height: 1.5; color: #fff; margin-bottom: 8px; }
    .narrative-quote span { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--c-blue-light); }
    .narrative-question { margin-top: 16px; padding: 16px 22px; border-left: 2px solid var(--c-blue); background: rgba(68,120,200,0.08); }
    .narrative-question p { font-size: 15px; font-weight: 600; line-height: 1.45; color: #fff; }

    .focus-grid-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue); margin-top: 26px; }

    .company-lead { max-width: 760px; margin-bottom: 34px; }
    .company-taggroups { display: flex; flex-direction: column; gap: 24px; }
    .company-tag-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue-light); margin-bottom: 13px; }
    .company-tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .company-tag { padding: 9px 18px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 2px; transition: background 0.2s, border-color 0.2s; }
    .company-tag:hover { background: rgba(68,120,200,0.18); border-color: rgba(107,157,232,0.4); }

    .flow-diagram { display: flex; flex-direction: column; gap: 0; margin-bottom: 8px; }
    .flow-band { background: var(--c-blue); color: #fff; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; padding: 12px 20px; }
    .flow-chain { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 14px; background: rgba(255,255,255,0.04); padding: 32px 24px; }
    .flow-node { padding: 16px 22px; font-size: 14px; font-weight: 500; color: #fff; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); text-align: center; min-width: 120px; }
    .flow-arrow { color: var(--c-blue-light); font-size: 20px; font-weight: 300; }

    /* ═══════════════════════════════════════════════════════════
       CHAPTER 4 — PROCESS
       ═══════════════════════════════════════════════════════════ */

    .process-header { margin-bottom: 40px; }
    .process-title { font-size: clamp(28px, 3.4vw, 54px); font-weight: 300; line-height: 1.12; letter-spacing: -0.02em; color: var(--c-dark); }
    .process-title em { font-style: normal; font-weight: 500; }
    .process-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: relative; z-index: 1; }
    .process-step { padding: 24px 28px 28px 0; }
    .process-step::before { content: ''; display: block; width: 0; height: 2px; background: var(--c-blue-mid); margin-bottom: 20px; transition: width 0.6s var(--ease-out); }
    .chapter.is-active .process-step:nth-child(1)::before { width: 100%; transition-delay: 0.4s; }
    .chapter.is-active .process-step:nth-child(2)::before { width: 100%; transition-delay: 0.65s; }
    .chapter.is-active .process-step:nth-child(3)::before { width: 100%; transition-delay: 0.9s; }
    .chapter.is-active .process-step:nth-child(4)::before { width: 100%; transition-delay: 1.15s; }
    .proc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-border); margin-bottom: 18px; transition: background 0.4s, box-shadow 0.4s; }
    .chapter.is-active .process-step:nth-child(1) .proc-dot { background: var(--c-blue-mid); box-shadow: 0 0 0 4px rgba(68,120,200,0.2); transition-delay: 0.5s; }
    .chapter.is-active .process-step:nth-child(2) .proc-dot { background: var(--c-blue-mid); box-shadow: 0 0 0 4px rgba(68,120,200,0.2); transition-delay: 0.75s; }
    .chapter.is-active .process-step:nth-child(3) .proc-dot { background: var(--c-blue-mid); box-shadow: 0 0 0 4px rgba(68,120,200,0.2); transition-delay: 1.0s; }
    .chapter.is-active .process-step:nth-child(4) .proc-dot { background: var(--c-blue-mid); box-shadow: 0 0 0 4px rgba(68,120,200,0.2); transition-delay: 1.25s; }
    .proc-idx { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--c-blue); margin-bottom: 10px; }
    .proc-title { font-size: 17px; font-weight: 500; line-height: 1.3; margin-bottom: 18px; color: var(--c-dark); }
    .proc-items li { font-size: 14px; line-height: 1.62; color: var(--c-text-dim); padding: 7px 0; border-bottom: 1px solid var(--c-border); display: flex; gap: 10px; }
    .proc-items li:last-child { border-bottom: none; }
    .proc-items li::before { content: '—'; flex-shrink: 0; opacity: 0.3; font-size: 11px; }
    .proc-optional { margin-top: 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-blue); opacity: 0.55; }

    /* ═══════════════════════════════════════════════════════════
       CHAPTER 5 — ASSESSMENT STREAMS  (elegant grouped list)
       ═══════════════════════════════════════════════════════════ */

    .streams-bg { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
    .streams-bg-gradient { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 80% at 50% 100%, rgba(27,61,114,0.35) 0%, transparent 65%); }

    .streams-header { margin-bottom: 44px; }
    .streams-title { font-size: clamp(32px, 4vw, 62px); font-weight: 300; line-height: 1.1; letter-spacing: -0.025em; }
    .streams-title em { font-style: normal; font-weight: 500; }
    .streams-subtitle { font-size: 15px; line-height: 1.7; color: rgba(255,255,255,0.38); max-width: 480px; margin-top: 14px; }

    /* Grouped consulting list — 3 columns */
    .streams-columns {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .streams-group {
      padding: 0 40px 0 0;
      border-right: 1px solid rgba(255,255,255,0.07);
    }
    .streams-group:last-child { border-right: none; padding-right: 0; padding-left: 40px; }
    .streams-group:nth-child(2) { padding: 0 40px; }

    .stream-group-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--c-blue-mid);
      margin-bottom: 20px; padding-bottom: 14px;
      border-bottom: 1px solid rgba(68,120,200,0.25);
    }

    .stream-entry {
      display: flex; align-items: baseline; gap: 14px;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
      opacity: 0; transform: translateX(-8px);
    }
    .chapter.is-active .stream-entry {
      opacity: 1; transform: translateX(0);
      transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
    }
    /* stagger delays per entry */
    .chapter.is-active .streams-group:nth-child(1) .stream-entry:nth-child(2) { transition-delay: 0.28s; }
    .chapter.is-active .streams-group:nth-child(1) .stream-entry:nth-child(3) { transition-delay: 0.35s; }
    .chapter.is-active .streams-group:nth-child(1) .stream-entry:nth-child(4) { transition-delay: 0.42s; }
    .chapter.is-active .streams-group:nth-child(1) .stream-entry:nth-child(5) { transition-delay: 0.49s; }
    .chapter.is-active .streams-group:nth-child(1) .stream-entry:nth-child(6) { transition-delay: 0.56s; }
    .chapter.is-active .streams-group:nth-child(1) .stream-entry:nth-child(7) { transition-delay: 0.63s; }
    .chapter.is-active .streams-group:nth-child(2) .stream-entry:nth-child(2) { transition-delay: 0.32s; }
    .chapter.is-active .streams-group:nth-child(2) .stream-entry:nth-child(3) { transition-delay: 0.39s; }
    .chapter.is-active .streams-group:nth-child(2) .stream-entry:nth-child(4) { transition-delay: 0.46s; }
    .chapter.is-active .streams-group:nth-child(2) .stream-entry:nth-child(5) { transition-delay: 0.53s; }
    .chapter.is-active .streams-group:nth-child(2) .stream-entry:nth-child(6) { transition-delay: 0.60s; }
    .chapter.is-active .streams-group:nth-child(2) .stream-entry:nth-child(7) { transition-delay: 0.67s; }
    .chapter.is-active .streams-group:nth-child(3) .stream-entry:nth-child(2) { transition-delay: 0.36s; }
    .chapter.is-active .streams-group:nth-child(3) .stream-entry:nth-child(3) { transition-delay: 0.43s; }
    .chapter.is-active .streams-group:nth-child(3) .stream-entry:nth-child(4) { transition-delay: 0.50s; }

    .stream-n { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: var(--c-blue-mid); flex-shrink: 0; min-width: 20px; }
    .stream-name { font-size: 14px; line-height: 1.45; color: rgba(255,255,255,0.78); }
    .stream-entry:hover .stream-name { color: #fff; }

    /* ═══════════════════════════════════════════════════════════
       CHAPTER 6 — BENEFITS  (redesigned ROI stats)
       ═══════════════════════════════════════════════════════════ */

    .benefits-header { margin-bottom: 36px; }
    .benefits-title { font-size: clamp(28px, 3.4vw, 52px); font-weight: 300; line-height: 1.12; letter-spacing: -0.02em; color: var(--c-dark); }
    .benefits-title em { font-style: normal; font-weight: 500; }
    .benefits-layout { display: grid; grid-template-columns: 1fr 1fr 320px; gap: 52px; align-items: start; }
    .benefits-col-label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--c-blue); margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--c-border); }
    .benefits-list li { font-size: 14px; line-height: 1.62; color: #384256; padding: 8px 0; border-bottom: 1px solid var(--c-border); display: flex; align-items: flex-start; gap: 11px; }
    .benefits-list li::before { content: ''; flex-shrink: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--c-blue); margin-top: 7px; }

    /* ── ROI Panel — light elegant stats ── */
    .roi-panel {
      display: flex; flex-direction: column;
      background: #fff;
      border: 1px solid var(--c-border);
      overflow: hidden;
    }

    .roi-stat-item {
      padding: 26px 26px 22px;
      position: relative;
      border-bottom: 1px solid var(--c-border);
      background: #fff;
    }
    .roi-stat-item:last-child { border-bottom: none; }

    /* thin blue top accent per item */
    .roi-stat-item::before {
      content: ''; position: absolute; top: 0; left: 26px; right: 26px; height: 1px;
      background: linear-gradient(90deg, var(--c-blue-mid), transparent);
      opacity: 0.35;
    }
    .roi-stat-item:first-child::before { display: none; }

    .roi-tag {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--c-blue);
      margin-bottom: 14px;
    }

    /* elegant thin-border value box */
    .roi-value-box {
      border: 1px solid rgba(47,95,173,0.18);
      background: rgba(47,95,173,0.03);
      padding: 10px 14px 11px;
      margin-bottom: 10px;
      display: inline-block;
    }

    .roi-big-value {
      font-size: 32px; font-weight: 300; letter-spacing: -0.03em;
      line-height: 1; color: var(--c-navy);
    }

    .roi-desc {
      font-size: 12px; font-weight: 500; color: #8090A8;
      margin-bottom: 18px; letter-spacing: 0.02em;
    }

    /* Animated progress bar */
    .roi-bar-track {
      height: 1.5px; background: rgba(0,0,0,0.07);
      position: relative; overflow: visible;
    }
    .roi-bar-fill {
      height: 100%; width: 0;
      background: linear-gradient(90deg, var(--c-blue) 0%, var(--c-blue-light) 100%);
      transition: none; position: relative;
    }
    .roi-bar-fill::after {
      content: ''; position: absolute; right: -3px; top: -3px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--c-blue-mid);
      box-shadow: 0 0 6px rgba(68,120,200,0.6);
    }
    .chapter.is-active .roi-bar-fill-1 { width: 80%; transition: width 2s var(--ease-out) 0.5s; }
    .chapter.is-active .roi-bar-fill-2 { width: 90%; transition: width 2s var(--ease-out) 0.8s; }

    .roi-pct { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--c-blue); margin-top: 8px; }

    /* ═══════════════════════════════════════════════════════════
       CHAPTER 7 — TEAM
       ═══════════════════════════════════════════════════════════ */

    .team-header { margin-bottom: 36px; }
    .team-title { font-size: clamp(26px, 3vw, 48px); font-weight: 300; line-height: 1.14; letter-spacing: -0.02em; color: var(--c-dark); }
    .team-title em { font-style: normal; font-weight: 500; }
    .team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--c-border); max-width: 920px; margin: 0 auto; }
    .team-card { background: var(--c-white); padding: 44px 40px 48px; transition: transform 0.35s var(--ease-out), box-shadow 0.35s; }
    .team-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.1); z-index: 2; }
    .team-avatar { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--c-navy) 0%, var(--c-blue-mid) 100%); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 22px; box-shadow: 0 4px 16px rgba(47,95,173,0.3); }
    .team-name { font-size: 21px; font-weight: 500; color: var(--c-dark); margin-bottom: 4px; }
    .team-role { font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-blue); margin-bottom: 24px; }
    .team-section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: rgba(0,0,0,0.25); margin-bottom: 6px; }
    .team-detail { font-size: 14px; line-height: 1.65; color: var(--c-text-dim); margin-bottom: 18px; }
    .team-contact { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--c-border); }
    .team-contact a { display: block; font-size: 13px; color: var(--c-blue); margin-bottom: 2px; transition: opacity 0.2s; }
    .team-contact a:hover { opacity: 0.65; }

    /* ═══════════════════════════════════════════════════════════
       CHAPTER 8 — CTA  (mountain bg + large F logo)
       ═══════════════════════════════════════════════════════════ */

    .cta-bg-mountain { position: absolute; inset: 0; z-index: 1; }
    .cta-overlay { position: absolute; inset: 0; z-index: 2; background: linear-gradient(to right, rgba(8,12,22,0.92) 40%, rgba(8,12,22,0.7) 100%); }
    #hero-canvas-2 { position: absolute; inset: 0; z-index: 3; opacity: 0.18; }

    .cta-inner { flex: 1; display: flex; flex-direction: column; justify-content: center; }

    /* Large F logo in CTA */
    .cta-logo {
      display: flex; align-items: center; gap: 14px; margin-bottom: 40px;
    }
    .cta-logo-f {
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(255,255,255,0.96);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Pinyon Script', serif; font-style: normal;
      font-size: 44px; font-weight: 400; color: var(--c-navy);
      line-height: 1;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .cta-logo-f span {
      display: block;
      transform: translate(-6px, 2px);
    }
    .cta-logo-text { font-size: 12px; font-weight: 700; letter-spacing: 0.15em; color: rgba(255,255,255,0.5); text-transform: uppercase; }

    .cta-title { font-size: clamp(38px, 5.2vw, 78px); font-weight: 300; line-height: 1.08; letter-spacing: -0.025em; max-width: 820px; margin-bottom: 40px; }
    .cta-title em { font-style: normal; font-weight: 500; }
    .cta-actions { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 60px; }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-family: var(--font); font-size: 14px; font-weight: 500; letter-spacing: 0.02em; cursor: pointer; transition: all 0.22s; }
    .btn-primary { background: var(--c-white); color: var(--c-dark); }
    .btn-primary:hover { background: #d8e3f8; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
    .btn-secondary { background: transparent; color: rgba(255,255,255,0.62); border: 1px solid rgba(255,255,255,0.16); }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.4); color: #fff; transform: translateY(-1px); }

    .cta-contact-row { display: grid; grid-template-columns: repeat(3, max-content); gap: 52px; padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.07); }
    .cta-contact-label { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.22); margin-bottom: 6px; }
    .cta-contact-value { font-size: 14px; color: rgba(255,255,255,0.68); transition: color 0.2s; }
    .cta-contact-value:hover { color: #fff; }

    /* ═══════════════════════════════════════════════════════════
       SIDE CONTROLS
       ═══════════════════════════════════════════════════════════ */

    #chapter-dots { position: fixed; left: 26px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 300; }
    .dot { width: 5px; height: 5px; border-radius: 50%; cursor: pointer; transition: all 0.32s var(--ease-spring); }
    .dot.on-dark-dot  { background: rgba(255,255,255,0.2); }
    .dot.on-light-dot { background: rgba(0,0,0,0.15); }
    .dot.active.on-dark-dot  { background: #fff; transform: scale(1.6); }
    .dot.active.on-light-dot { background: var(--c-dark); transform: scale(1.6); }

    #nav-arrows { position: fixed; right: 26px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 300; }
    .arrow-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; transition: all 0.22s; }
    .arrow-btn.on-dark  { background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.09); color: rgba(255,255,255,0.5); }
    .arrow-btn.on-light { background: rgba(0,0,0,0.045); border: 1px solid rgba(0,0,0,0.09); color: rgba(0,0,0,0.42); }
    .arrow-btn.on-dark:hover  { background: rgba(255,255,255,0.12); color: #fff; }
    .arrow-btn.on-light:hover { background: rgba(0,0,0,0.08); color: var(--c-dark); }
    .arrow-btn:disabled { opacity: 0.18; pointer-events: none; }

    /* ═══════════════════════════════════════════════════════════
       MOBILE MENU
       ═══════════════════════════════════════════════════════════ */

    #mobile-menu { display: none; position: fixed; inset: 0; background: var(--c-dark); z-index: 600; flex-direction: column; padding: 80px 40px 48px; }
    #mobile-menu.open { display: flex; }
    .mob-close { position: absolute; top: 18px; right: 22px; font-size: 22px; color: rgba(255,255,255,0.4); padding: 8px; }
    .mob-items { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .mob-items li { border-bottom: 1px solid rgba(255,255,255,0.05); }
    .mob-items li a { display: block; font-size: 20px; font-weight: 300; color: rgba(255,255,255,0.62); padding: 14px 0; cursor: pointer; transition: color 0.2s; }
    .mob-items li a:hover { color: #fff; }
    .mob-footer { font-size: 11px; color: rgba(255,255,255,0.18); letter-spacing: 0.08em; }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════════════════════ */

    @media (max-width: 1100px) {
      :root { --pad-x: 48px; }
      .focus-grid { grid-template-columns: repeat(2, 1fr); }
      .benefits-layout { grid-template-columns: 1fr 1fr; }
      .streams-columns { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 900px) {
      :root { --pad-x: 32px; }
      .nav-menu, .nav-right { display: none; }
      .nav-hamburger { display: flex; }
      #chapter-dots, #nav-arrows { display: none; }
      .expertise-grid, .process-grid, .team-grid { grid-template-columns: 1fr; }
      .streams-columns { grid-template-columns: 1fr; }
      .narrative-columns { grid-template-columns: 1fr; gap: 8px; }
      .streams-group { padding: 0 0 24px 0 !important; border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.06); }
      .benefits-layout { grid-template-columns: 1fr; }
      .cta-contact-row { gap: 28px; }
    }
    @media (max-width: 600px) {
      .focus-grid { grid-template-columns: 1fr; }
      .hero-stats { flex-direction: column; gap: 18px; }
      .cta-contact-row { grid-template-columns: 1fr; gap: 16px; }
    }

    /* ═══════════════════════════════════════════════════════════
       MOBILE SCROLL FIX
       Below 900px the deck stops paginating one-viewport-per-chapter
       and becomes a normal scrolling page: every chapter lays out in
       document flow at its natural (content-driven) height instead of
       a clipped 100vh box, so nothing is ever cropped or unreachable.
       ═══════════════════════════════════════════════════════════ */
    @media (max-width: 900px) {
      html, body { height: auto; overflow: visible; overflow-x: hidden; }
      #presentation { height: auto; overflow: visible; }

      .chapter {
        position: relative; inset: auto;
        min-height: 100vh; height: auto;
        opacity: 1 !important; transform: none !important; pointer-events: all !important;
      }

      .ch-inner { padding-bottom: 64px; }

      /* content authored to reveal only on .is-active must stay visible
         once chapters are stacked in normal scroll flow */
      .anim { opacity: 1 !important; transform: none !important; animation: none !important; }
      .process-step::before { width: 100% !important; transition: none !important; }
      .proc-dot { background: var(--c-blue-mid) !important; box-shadow: 0 0 0 4px rgba(68,120,200,0.2) !important; }
      .stream-entry { opacity: 1 !important; transform: none !important; transition: none !important; }
      .roi-bar-fill-1 { width: 80% !important; transition: none !important; }
      .roi-bar-fill-2 { width: 90% !important; transition: none !important; }
    }


    /* ═══════════════════════════════════════════════════════════
       PDF GENERATION MODE
       ═══════════════════════════════════════════════════════════ */
    body.pdf-mode #nav,
    body.pdf-mode #chapter-dots,
    body.pdf-mode #nav-arrows,
    body.pdf-mode #mobile-menu,
    body.pdf-mode .btn-primary,
    body.pdf-mode #hero-canvas,
    body.pdf-mode #hero-canvas-2 { display: none !important; }

    body.pdf-mode .chapter { transition: none !important; }
    body.pdf-mode .anim { opacity: 1 !important; transform: none !important; animation: none !important; }
    body.pdf-mode .chapter.is-active .anim { opacity: 1 !important; transform: none !important; animation: none !important; }
    body.pdf-mode .process-step::before { width: 100% !important; transition: none !important; }
    body.pdf-mode .proc-dot { background: var(--c-blue-mid) !important; box-shadow: 0 0 0 4px rgba(68,120,200,0.2) !important; }
    body.pdf-mode .roi-bar-fill-1 { width: 80% !important; }
    body.pdf-mode .roi-bar-fill-2 { width: 90% !important; }
    body.pdf-mode .stream-entry { opacity: 1 !important; transform: none !important; transition: none !important; }
    body.pdf-mode #presentation { overflow: visible; }

    /* Fix -webkit-background-clip gradient text */
    body.pdf-mode .hero-title,
    body.pdf-mode .hero-stat-value,
    body.pdf-mode .expertise-title { -webkit-text-fill-color: #fff !important; background: none !important; }
    body.pdf-mode .hero-stat-value { color: #fff !important; }
    body.pdf-mode .roi-big-value   { color: var(--c-navy) !important; }

    body.pdf-mode .chapter.is-active { position: absolute !important; inset: 0 !important; }

    /* Hero: keep flex-end so content sits in lower portion like on web */
    body.pdf-mode #presentation .chapter:first-child .ch-inner {
      justify-content: flex-end !important;
    }

    /* Center all other chapters' content */
    body.pdf-mode .ch-inner {
      padding-top: 52px !important;
      padding-bottom: 52px !important;
      justify-content: center !important;
    }
    body.pdf-mode #presentation .chapter:first-child .ch-inner {
      justify-content: flex-end !important;
      padding-bottom: 60px !important;
    }

    #pdf-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(8,12,22,0.94);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: var(--font); color: #fff;
    }
    #pdf-overlay h3 { font-size: 20px; font-weight: 400; margin-bottom: 10px; letter-spacing: -0.01em; }
    #pdf-overlay p  { font-size: 13px; color: rgba(255,255,255,0.42); margin-bottom: 32px; }
    .pdf-progress-track { width: 260px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 1px; overflow: hidden; }
    .pdf-progress-fill  { height: 100%; background: linear-gradient(90deg, var(--c-blue), var(--c-blue-light)); border-radius: 1px; transition: width 0.3s; }

  </style>
</head>
<body data-dense-nav>

  <!-- ══════ NAVIGATION ══════ -->
  <nav id="nav" class="on-dark">
    <div class="nav-logo" onclick="engine.goTo(0)">
      <div class="nav-logo-f"><span>F</span></div>
      <span class="nav-logo-text">FRONTEM</span>
    </div>
    <ul class="nav-menu" id="nav-menu"></ul>
    <div class="nav-right">
      <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
        <button class="lang-btn active" data-lang="de" onclick="setLanguage('de')" aria-label="Deutsch">DE</button>
        <span class="lang-sep">/</span>
        <button class="lang-btn" data-lang="en" onclick="setLanguage('en')" aria-label="English">EN</button>
      </div>
      <span class="chapter-counter" id="chapter-counter">01 / 08</span>
      <div class="nav-progress-track"><div class="nav-progress-fill" id="progress-fill" style="width:12.5%"></div></div>
    </div>
    <button class="nav-hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </nav>

  <div id="chapter-dots"></div>

  <div id="nav-arrows">
    <button class="arrow-btn on-dark" id="btn-prev" disabled>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 11L7 3M7 3L3.5 6.5M7 3L10.5 6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="arrow-btn on-dark" id="btn-next">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 3L7 11M7 11L10.5 7.5M7 11L3.5 7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <main id="presentation"></main>

  <div id="mobile-menu">
    <button class="mob-close" id="mob-close">✕</button>
    <ul class="mob-items" id="mob-items"></ul>

  const _particleLoops = {};
  function initParticles(canvasId) {
    if (_particleLoops[canvasId]) { cancelAnimationFrame(_particleLoops[canvasId].raf); window.removeEventListener('resize', _particleLoops[canvasId].onResize); }
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, particles;

    const resize = () => { W = canvas.width = canvas.offsetWidth; H = canvas.height = canvas.offsetHeight; };
    const mkParts = () => {
      particles = [];
      const n = Math.floor((W*H)/20000);
      for (let i=0;i<n;i++) particles.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.1+0.3, vx:(Math.random()-.5)*.16, vy:(Math.random()-.5)*.16, o:Math.random()*.45+.08 });
    };
    const draw = () => {
      ctx.clearRect(0,0,W,H);
      for (let i=0;i<particles.length;i++) for (let j=i+1;j<particles.length;j++) {
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y, d=Math.hypot(dx,dy);
        if (d<110) { ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.strokeStyle=`rgba(68,120,200,${(1-d/110)*.14})`; ctx.lineWidth=.5; ctx.stroke(); }
      }
      for (const p of particles) { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=`rgba(107,157,232,${p.o})`; ctx.fill(); p.x+=p.vx; p.y+=p.vy; if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0; }
      _particleLoops[canvasId].raf = requestAnimationFrame(draw);
    };
    const onResize = () => { resize(); mkParts(); };
    resize(); mkParts();
    _particleLoops[canvasId] = { raf:null, onResize };
    draw();
    window.addEventListener('resize', onResize);
  }

  /* ════════════════════════════════════════════════════════════
     PRESENTATION ENGINE
     ════════════════════════════════════════════════════════════ */

  const isMobileLayout = () => window.matchMedia('(max-width: 900px)').matches;

  class PresentationEngine {
    constructor(cfg) {
      this.config = cfg; this.chapters = cfg.chapters; this.total = cfg.chapters.length;
      this.current = 0; this.busy = false; this.touchY = null;
      this._build(); this._bindNav(); this._bindEvents(); this._bindMobileScrollSync();
      this.goTo(0, false);
      setTimeout(() => { initParticles('hero-canvas'); initParticles('hero-canvas-2'); }, 120);
    }

    _build() {
      const pres = document.getElementById('presentation');
      const nm   = document.getElementById('nav-menu');
      const ml   = document.getElementById('mob-items');
      const dots = document.getElementById('chapter-dots');

      this.chapters.forEach((ch, i) => {
        const thCls = {dark:'ch-dark','dark-navy':'ch-dark-navy',light:'ch-light',white:'ch-white'}[ch.theme]||'ch-dark';
        const r     = Renderers[ch.type];
        const html  = r ? r(ch, this.config.meta) : `<div class="ch-inner"><p>No renderer for '${ch.type}'</p></div>`;

        const el = document.createElement('div');
        el.className = `chapter ${thCls} is-below`;
        el.dataset.index = i; el.dataset.theme = ch.theme;
        el.innerHTML = html; pres.appendChild(el); ch._el = el;

        const li=document.createElement('li'), a=document.createElement('a');
        a.textContent=ch.nav; a.onclick=()=>this.goTo(i); li.appendChild(a); nm.appendChild(li); ch._navA=a;

        const mli=document.createElement('li'), ma=document.createElement('a');
        ma.textContent=ch.nav; ma.onclick=()=>{
          document.getElementById('mobile-menu').classList.remove('open');
          if (isMobileLayout()) ch._el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          else this.goTo(i);
        };
        mli.appendChild(ma); ml.appendChild(mli); ch._mobA=ma;

        const dot=document.createElement('div'); dot.className='dot on-dark-dot';
        dot.onclick=()=>this.goTo(i); dots.appendChild(dot); ch._dot=dot;
      });

      this._els = {
        nav:     document.getElementById('nav'),
        counter: document.getElementById('chapter-counter'),
        fill:    document.getElementById('progress-fill'),
        prev:    document.getElementById('btn-prev'),
        next:    document.getElementById('btn-next'),
      };
    }

    goTo(index, animate=true) {
      if (this.busy && animate) return;
      index = Math.max(0, Math.min(this.total-1, index));
      if (index===this.current && animate) return;
      this.current = index;
      if (animate) { this.busy=true; setTimeout(()=>{ this.busy=false; }, 860); }
      this.chapters.forEach((ch,i) => {
        ch._el.classList.remove('is-active','is-above','is-below');
        if (i<index) ch._el.classList.add('is-above');
        else if (i>index) ch._el.classList.add('is-below');
        else ch._el.classList.add('is-active');
      });
      this._updateUI(index);
    }

    _updateUI(i) {
      const ch    = this.chapters[i];
      const isDrk = ['dark','dark-navy','dark-3'].includes(ch.theme);
      this._els.nav.classList.toggle('on-dark', isDrk);
      this._els.nav.classList.toggle('on-light', !isDrk);
      document.querySelectorAll('.dot').forEach(d => { d.classList.toggle('on-dark-dot',isDrk); d.classList.toggle('on-light-dot',!isDrk); });
      document.querySelectorAll('.arrow-btn').forEach(b => { b.classList.toggle('on-dark',isDrk); b.classList.toggle('on-light',!isDrk); });
      this.chapters.forEach((c,j) => { c._navA.classList.toggle('active',j===i); c._dot.classList.toggle('active',j===i); });
      this._els.counter.textContent = `${String(i+1).padStart(2,'0')} / ${String(this.total).padStart(2,'0')}`;
      this._els.fill.style.width = `${((i+1)/this.total)*100}%`;
      this._els.prev.disabled = i===0;
      this._els.next.disabled = i===this.total-1;
    }

    _bindNav() {
      this._els.prev.onclick=()=>this.goTo(this.current-1);
      this._els.next.onclick=()=>this.goTo(this.current+1);
      document.getElementById('hamburger').onclick=()=>document.getElementById('mobile-menu').classList.add('open');
      document.getElementById('mob-close').onclick=()=>document.getElementById('mobile-menu').classList.remove('open');
    }

    _bindEvents() {
      window.addEventListener('keydown', e => {
        if (isMobileLayout()) return; // let arrow/page keys scroll the page normally
        if (['ArrowDown','PageDown'].includes(e.key)) { e.preventDefault(); this.goTo(this.current+1); }
        if (['ArrowUp','PageUp'].includes(e.key))     { e.preventDefault(); this.goTo(this.current-1); }
        if (e.key==='Home') this.goTo(0); if (e.key==='End') this.goTo(this.total-1);
        if (e.key==='Escape') document.getElementById('mobile-menu').classList.remove('open');
      });
      let wc=false;
      window.addEventListener('wheel', e => {
        if (isMobileLayout()) return;
        if (this.busy||wc||Math.abs(e.deltaY)<20) return;
        wc=true; setTimeout(()=>{ wc=false; },950);
        if (e.deltaY>0) this.goTo(this.current+1); else this.goTo(this.current-1);
      }, {passive:true});
      window.addEventListener('touchstart', e=>{ this.touchY=e.touches[0].clientY; },{passive:true});
      window.addEventListener('touchend',   e=>{
        if (isMobileLayout()) { this.touchY=null; return; } // swipes scroll the page, they don't page chapters
        if (!this.touchY) return;
        const dy=this.touchY-e.changedTouches[0].clientY;
        if (Math.abs(dy)<44) return;
        if (dy>0) this.goTo(this.current+1); else this.goTo(this.current-1);
        this.touchY=null;
      },{passive:true});
    }

    // On mobile every chapter is stacked in normal document flow, so the
    // fixed nav bar's light/dark theme, counter and progress fill need to
    // track scroll position instead of the paginated goTo() transitions.
    _mobileCurrentChapter() {
      const line = document.getElementById('nav').offsetHeight + 8; // just below the fixed nav
      let idx = 0;
      for (let i = 0; i < this.chapters.length; i++) {
        if (this.chapters[i]._el.getBoundingClientRect().top <= line) idx = i;
      }
      return idx;
    }

    _bindMobileScrollSync() {
      const sync = () => {
        if (!isMobileLayout()) return;
        const i = this._mobileCurrentChapter();
        if (i === this.current) return;
        this.current = i;
        this._updateUI(i);
      };
      window.addEventListener('scroll', sync, { passive: true });
      window.addEventListener('resize', sync);
      sync();
    }
  }

  const engine = new PresentationEngine(PRESENTATION);

  /* ════════════════════════════════════════════════════════════
     LANGUAGE SWITCHING — re-renders chapter content in place
     using the same engine instance, DOM nodes, and animations.
     ════════════════════════════════════════════════════════════ */

  let currentLangConfig = PRESENTATION_DE;

  function setLanguage(lang) {
    const target = lang === 'en' ? PRESENTATION_EN : PRESENTATION_DE;
    if (target === currentLangConfig) return;
    currentLangConfig = target;

    engine.chapters.forEach((ch, i) => {
      const data = target.chapters[i];
      const r = Renderers[data.type];
      ch._el.innerHTML = r ? r(data, target.meta) : '';
      ch._navA.textContent = data.nav;
      if (ch._mobA) ch._mobA.textContent = data.nav;
      // NOTE: intentionally not mutating `ch` itself (it's a direct reference into
      // PRESENTATION_DE.chapters) — only its DOM-bound fields are updated above,
      // so the underlying language data objects stay pristine and switchable both ways.
    });

    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

    // canvases (hero & CTA particle backgrounds) are recreated by innerHTML — reinit them
    initParticles('hero-canvas'); initParticles('hero-canvas-2');
  }

  /* ════════════════════════════════════════════════════════════
     PDF EXPORT  — html2canvas + jsPDF (landscape A4)
     ════════════════════════════════════════════════════════════ */

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function generatePDF() {
    const overlay = document.createElement('div');
    overlay.id = 'pdf-overlay';
    overlay.innerHTML = `
      <h3>Generating PDF presentation…</h3>
      <p id="pdf-status">Loading libraries…</p>
      <div class="pdf-progress-track"><div class="pdf-progress-fill" id="pdf-prog" style="width:0%"></div></div>`;
    document.body.appendChild(overlay);

    const setStatus = (txt, pct) => {
      const s = document.getElementById('pdf-status');
      const p = document.getElementById('pdf-prog');
      if (s) s.textContent = txt;
      if (p) p.style.width = pct + '%';
    };

    const presEl        = document.getElementById('presentation');
    const origBodyH     = document.body.style.height;
    const origBodyOv    = document.body.style.overflow;
    const origHtmlH     = document.documentElement.style.height;
    const origPresH     = presEl.style.height;
    const originalIndex = engine.current;

    try {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');

      // Ensure all fonts are fully loaded before any capture
      await document.fonts.ready;

      const { jsPDF } = window.jspdf;
      const pdfW = 297, pdfH = 210;
      const pdf  = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

      // Resize to exact A4 ratio — eliminates black bars
      const vpW = window.innerWidth;
      const a4H = Math.round(vpW * pdfH / pdfW);

      document.documentElement.style.height = a4H + 'px';
      document.body.style.height   = a4H + 'px';
      document.body.style.overflow = 'hidden';
      presEl.style.height          = a4H + 'px';

      const total = engine.total;
      document.body.classList.add('pdf-mode');

      for (let i = 0; i < total; i++) {
        setStatus('Rendering slide ' + (i + 1) + ' of ' + total + '…', Math.round((i / total) * 88));

        engine.chapters.forEach((ch, j) => {
          ch._el.classList.remove('is-active', 'is-above', 'is-below');
          if (j === i) {
            ch._el.style.cssText = 'transition:none!important;opacity:1!important;transform:none!important;pointer-events:all!important;height:' + a4H + 'px!important;';
          } else {
            ch._el.style.cssText = 'transition:none!important;opacity:0!important;transform:none!important;pointer-events:none!important;';
          }
        });

        // Wait for layout + images to settle
        await new Promise(r => setTimeout(r, 200));

        // Scale 3 = ~360 DPI — crisp fonts, manageable file size
        const canvas = await html2canvas(presEl, {
          scale: 3,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#080C16',
          logging: false,
          width:  vpW,
          height: a4H,
          windowWidth:  vpW,
          windowHeight: a4H,
          imageTimeout: 0,
          ignoreElements: el =>
            el.id === 'hero-canvas'   ||
            el.id === 'hero-canvas-2' ||
            el.id === 'nav'           ||
            el.id === 'chapter-dots'  ||
            el.id === 'nav-arrows',
        });

        // JPEG 0.92 — sharp enough at 360 DPI, ~5x smaller than PNG
        const imgData = canvas.toDataURL('image/jpeg', 0.92);

        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH, undefined, 'SLOW');

        // Clickable mailto on last chapter
        if (i === total - 1) {
          const linkBtn = presEl.querySelector('.btn-secondary');
          if (linkBtn) {
            const btnRect  = linkBtn.getBoundingClientRect();
            const presRect = presEl.getBoundingClientRect();
            const lx = ((btnRect.left  - presRect.left) / vpW) * pdfW;
            const ly = ((btnRect.top   - presRect.top)  / a4H) * pdfH;
            const lw = (btnRect.width  / vpW) * pdfW;
            const lh = (btnRect.height / a4H) * pdfH;
            pdf.link(lx, ly, lw, lh, { url: 'mailto:' + PRESENTATION.meta.contact.email });
          }
        }
      }

      setStatus('Saving…', 96);
      await new Promise(r => setTimeout(r, 60));
      pdf.save('Frontem-Strategic-Supply-Chain-Audit.pdf');

    } catch (err) {
      console.error('PDF error:', err);
      alert('PDF generation failed: ' + err.message);
    } finally {
      document.body.classList.remove('pdf-mode');
      document.documentElement.style.height = origHtmlH;
      document.body.style.height   = origBodyH;
      document.body.style.overflow = origBodyOv;
      presEl.style.height          = origPresH;
      engine.chapters.forEach(ch => { ch._el.style.cssText = ''; });
      engine.goTo(originalIndex, false);
      const ov = document.getElementById('pdf-overlay');
      if (ov) document.body.removeChild(ov);
    }
  }

  </script>
</body>
</html>
